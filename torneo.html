<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<title>Torneo MK11 live</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0708;
    --card: rgb(255 255 255 / .045);
    --line: rgb(255 255 255 / .1);
    --text: #f6efe7;
    --muted: rgb(246 239 231 / .62);
    --gold: #f0bd5a;
    --red: #e5281b;
    --hud: "Barlow Condensed", "Arial Narrow", sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse 120% 50% at 50% 110%, rgb(230 70 10 / .22), transparent 70%) fixed, radial-gradient(ellipse 90% 40% at 50% -8%, rgb(200 20 10 / .22), transparent 70%) fixed, var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .hud { font: 700 13px/1 var(--hud); letter-spacing: .12em; text-transform: uppercase; }
  .app { max-width: 1200px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 64px; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  h1 { margin: 0; font: 800 36px/1 var(--hud); text-transform: uppercase; }
  .fmt { margin: 8px 0 0; color: var(--gold); }
  .fmt + .hud { margin-top: 6px; color: var(--muted); }
  .cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border: 0; border-radius: var(--r); background: linear-gradient(180deg, #f2442e, #b5140b); box-shadow: 0 10px 28px -10px rgb(229 40 27 / .9), inset 0 1px 0 rgb(255 255 255 / .25); font: 800 20px/1 var(--hud); letter-spacing: .08em; text-transform: uppercase; color: #fff; transition: transform .2s, filter .2s; }
  .cta:hover { filter: brightness(1.1); }
  .cta:active { transform: scale(.97); }
  .cta svg { width: 28px; height: 28px; }
  .roll svg { animation: roll .7s var(--ease); }
  @keyframes roll { from { transform: rotate(-720deg) scale(.4); } }
  .warn { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding: 12px 14px; border: 1px solid var(--gold); border-radius: var(--r); background: rgb(240 189 90 / .1); color: var(--gold); }

  h2 { margin: 36px 0 12px; font: 800 26px/1 var(--hud); text-transform: uppercase; }
  h2 small { font: 700 14px var(--hud); letter-spacing: .1em; color: var(--muted); }

  /* prossimo incontro */
  .next { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .next button { min-width: 0; height: 96px; padding: 0 12px; overflow: hidden; border: 0; border-radius: 16px; font: 800 30px/1 var(--hud); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; color: #fff; transition: transform .2s; }
  .next button:active { transform: scale(.97); }
  .next .a { background: linear-gradient(160deg, #b8170e, #3a0604); }
  .next .b { background: linear-gradient(200deg, #1f3f9e, #070b26); }
  .vs { font: 800 38px/1 var(--hud); transform: rotate(-8deg); text-shadow: 0 3px 0 #000, 0 0 20px rgb(255 120 30 / .8); }
  .hint { margin: 8px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
  .champ { margin: 0; padding: 22px; border: 1px solid rgb(240 189 90 / .45); border-radius: 18px; background: linear-gradient(160deg, rgb(229 40 27 / .35), rgb(30 4 3 / .9)); text-align: center; font: 800 48px/1 var(--hud); text-transform: uppercase; color: var(--gold); }
  .champ small { display: block; margin-bottom: 8px; font: 700 15px var(--hud); letter-spacing: .14em; color: var(--text); }

  /* tabellone */
  .bracket { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
  .col { display: flex; flex: none; flex-direction: column; width: 180px; }
  .col h3 { margin: 0 0 8px; font: 700 13px/1 var(--hud); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .ms { display: flex; flex: 1; flex-direction: column; justify-content: space-around; gap: 10px; }
  .m { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .m.now { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 22px -8px rgb(255 120 20 / .7); }
  .no { position: absolute; top: 5px; right: 7px; font: 700 11px/1 var(--hud); color: var(--muted); }
  .m button { display: block; width: 100%; height: 38px; padding: 0 30px 0 10px; overflow: hidden; border: 0; background: none; text-align: left; white-space: nowrap; text-overflow: ellipsis; font: 700 18px/1 var(--hud); letter-spacing: .03em; text-transform: uppercase; }
  .m button + button { border-top: 1px solid var(--line); }
  .m button:disabled { cursor: default; }
  .m .tbd { font: 13px/1 system-ui, sans-serif; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .m .win { background: linear-gradient(90deg, rgb(240 189 90 / .28), transparent); color: var(--gold); }
  .m .lose { opacity: .4; text-decoration: line-through; }

  /* gironi */
  .gironi { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .grp { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: rgb(255 255 255 / .025); }
  .grp h3 { margin: 0 0 8px; font: 700 13px/1 var(--hud); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tab { width: 100%; margin-bottom: 12px; border-collapse: collapse; font: 700 17px/1 var(--hud); text-transform: uppercase; }
  .tab th { padding: 0 6px 6px; font-size: 12px; letter-spacing: .1em; color: var(--muted); text-align: right; }
  .tab td { padding: 7px 6px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  .tab td:nth-child(2) { width: 100%; text-align: left; }
  .tab td:first-child { color: var(--muted); }
  .tab .q td:nth-child(2) { color: var(--gold); }
  .gms { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .sc { float: right; margin-left: 6px; font-size: 14px; }

  /* giocatori */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .players label { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 12px; cursor: pointer; }
  .players label:has(input:not(:checked)) { opacity: .4; text-decoration: line-through; }
  .players input { flex: none; width: 18px; height: 18px; accent-color: var(--red); }
  .players div { min-width: 0; }
  .players b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 800 18px/1 var(--hud); text-transform: uppercase; }
  .players small { font-size: 12px; color: var(--muted); }
  .add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .inp { height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font: 700 20px/1 var(--hud); letter-spacing: .04em; outline: none; }
  .inp:focus { border-color: var(--gold); }
  .inp option { background: var(--bg); }
  .add input { flex: 1 1 200px; text-transform: uppercase; }
  .players li { display: flex; align-items: center; gap: 2px; padding-right: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .players li label { flex: 1; border: 0; background: none; }
  .mini { flex: none; width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; font-size: 18px; color: var(--muted); }
  .mini:hover { background: var(--card); color: var(--text); }

  /* regia: comandi visibili solo col token */
  body:not(.is-admin) .admin, body.is-admin .view { display: none !important; }
  .ctrl { display: flex; flex-wrap: wrap; gap: 8px; }
  .ghost { height: 52px; padding: 0 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); font: 700 18px/1 var(--hud); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .ghost:disabled { opacity: .4; cursor: default; }
  .set { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  .set label { display: grid; gap: 6px; color: var(--muted); }
  .set select { max-width: calc(100vw - 32px); }
  .set input { width: 110px; }
  .live { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #3bff7a; box-shadow: 0 0 8px #3bff7a; animation: pulse 1.4s ease-in-out infinite; }
  .live.off i { background: #ff3b1f; box-shadow: 0 0 8px #ff3b1f; }
  @keyframes pulse { 50% { opacity: .35; } }
  .oops { margin: 14px 0 0; font: 700 15px/1.2 var(--hud); letter-spacing: .06em; text-transform: uppercase; color: #ff4a2a; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <span class="live hud" id="live"><i></i><span>Collegamento…</span></span>
      <h1><span class="admin">Regia torneo</span><span class="view">Tabellone live</span></h1>
      <p class="fmt hud" id="fmt"></p>
      <p class="hud" id="durata"></p>
    </div>
    <div class="ctrl admin">
      <button type="button" class="cta" id="dado"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g fill="currentColor"><circle cx="8" cy="8" r="1.8"/><circle cx="16" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="8" cy="16" r="1.8"/><circle cx="16" cy="16" r="1.8"/></g></svg>Rifai sorteggio</button>
      <button type="button" class="ghost" id="azzera">Azzera risultati</button>
    </div>
  </header>

  <p class="oops" id="oops" role="alert" hidden></p>
  <div class="warn admin" id="warn" hidden><span class="hud">I giocatori sono cambiati: il sorteggio è quello vecchio</span><button type="button" class="cta" id="dado2">Rifai sorteggio</button></div>

  <section class="set admin">
    <label><span class="hud">Formato</span><select class="inp" id="formato"></select></label>
    <label><span class="hud">Minuti a incontro</span><input class="inp" id="minuti" type="number" min="1" max="30" inputmode="numeric"></label>
  </section>

  <section id="ora">
    <h2 id="ora-t"></h2>
    <div class="next" id="next"><button type="button" class="a"></button><span class="vs" aria-hidden="true">VS</span><button type="button" class="b"></button></div>
    <p class="hint admin" id="hint">Tocca chi ha vinto 2-0 · ritocca per il 2-1 · ancora per annullare</p>
    <p class="champ" id="champ" hidden></p>
  </section>

  <section id="gironi-s"><h2 id="gironi-t"></h2><div class="gironi" id="gironi"></div></section>
  <section id="ko-s"><h2>Fase finale</h2><div class="bracket" id="ko"></div></section>

  <section class="admin">
    <h2>Giocatori <small id="quanti"></small></h2>
    <ul class="players" id="players"></ul>
    <form class="add" id="add">
      <input class="inp" name="nome" placeholder="Aggiungi giocatore" maxlength="40" required pattern=".*\S.*" autocomplete="off" enterkeyhint="done" aria-label="Nome">
      <select class="inp" name="livello" aria-label="Livello"><option>Principiante</option><option>Me la cavo</option><option>Esperto</option></select>
      <button class="cta">Aggiungi</button>
    </form>
  </section>
</main>
<script>
  // chiave publishable: senza token si legge e basta; le scritture della regia passano da funzioni che controllano il token (regia.sql)
  const SB_URL = 'https://srqpgwmwxxebdcdffsck.supabase.co', SB_KEY = 'sb_publishable_6JG6QA9A0nFYZlBiFq7beg_25e6gq2w';
  const H = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  const sb = (q, o = {}) => fetch(`${SB_URL}/rest/v1/${q}`, { ...o, headers: { ...H, ...o.headers } });
  const rpc = (fn, body) => sb(`rpc/${fn}`, { method: 'POST', body: JSON.stringify(body) });
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const TIER = { 'Esperto': 0, 'Me la cavo': 1, 'Principiante': 2 };
  const TOKEN = decodeURIComponent(location.hash.slice(1));
  const POLL_MS = 3000; // ponytail: polling, basta per una festa; realtime di Supabase se servisse sotto il secondo

  // --- motore
  // gironi all'italiana + eliminazione diretta: nessun bye, tutti giocano contro tutti nel proprio girone
  const KO = ['Finale', 'Semifinali', 'Quarti', 'Ottavi'], LET = 'ABCDEFGH';
  // G gironi, passano i primi q di ognuno: gironi da almeno 3 (e più grandi di chi passa), così nessun girone è una formalità
  const valid = (n, G, q) => n === 2 ? G === 1 && q === 1 : n >= 3 && Math.floor(n / G) >= Math.max(3, q + 1);
  const formats = n => [1, 2, 4, 8].flatMap(G => [1, 2, 4].filter(q => valid(n, G, q)).map(q => ({ G, q })));
  // automatico: più gironi possibile con almeno 3 giocatori, passano i primi 2 → tutti fanno almeno 2 incontri e il torneo non si allunga
  const autoFmt = n => { let G = 1; while (G * 6 <= n && G < 8) G *= 2; return { G, q: n === 2 ? 1 : 2 }; };

  // order: id dei giocatori, i più forti per primi. Ogni lato di un incontro: un giocatore (id), un piazzamento nel girone (g, pos) o il vincente di un incontro (w)
  function build(order, G, q) {
    const Q = G * q, groups = Array.from({ length: G }, () => []);
    // a serpentina: le teste di serie finiscono in gironi diversi
    order.forEach((id, i) => { const r = i % (2 * G); groups[r < G ? r : 2 * G - 1 - r].push(id); });

    const M = [], add = m => M.push({ id: M.length, ...m }) - 1;
    // calendario col metodo del cerchio, turni alternati tra gironi: chi ha appena giocato riposa
    const rounds = groups.map(g => {
      const p = g.length % 2 ? [...g, null] : [...g], R = [];
      for (let r = 0; r < p.length - 1; r++) {
        R.push(p.slice(0, p.length / 2).map((x, i) => [x, p[p.length - 1 - i]]).filter(([x, y]) => x != null && y != null));
        p.splice(1, 0, p.pop());
      }
      return R;
    });
    for (let r = 0; r < Math.max(...rounds.map(R => R.length)); r++)
      rounds.forEach((R, g) => (R[r] || []).forEach(([x, y]) => add({ br: 'G', grp: g, title: `Girone ${LET[g]}`, a: { id: x }, b: { id: y } })));
    if (Q < 2) return { M, groups, G, q, Q, final: null };

    // fase finale a tabellone standard: chi arriva primo pesca chi arriva ultimo tra i qualificati, mai dello stesso girone al primo turno se si può
    const k = Math.log2(Q);
    let seeds = [1]; while (seeds.length < Q) { const L = seeds.length * 2 + 1; seeds = seeds.flatMap(x => [x, L - x]); }
    // testa di serie s → (girone, posizione): prima tutte le prime, poi tutte le seconde a gironi incrociati, ecc.
    const slot = s => { const pos = Math.floor((s - 1) / G), i = (s - 1) % G; return { g: pos % 2 && G > 1 ? (G - 1 - i) ^ 1 : i, pos }; };
    let prev = Array.from({ length: Q / 2 }, (_, i) => add({ br: 'K', col: 0, title: KO[k - 1], a: slot(seeds[2 * i]), b: slot(seeds[2 * i + 1]) }));
    for (let r = 1; r < k; r++) prev = Array.from({ length: prev.length / 2 }, (_, i) => add({ br: 'K', col: r, title: KO[k - 1 - r], a: { w: prev[2 * i] }, b: { w: prev[2 * i + 1] } }));
    return { M, groups, G, q, Q, final: prev[0] };
  }

  // res[id] = [vincitore, round vinti dal perdente (0 o 1)]; i risultati che non valgono più (è cambiato qualcosa prima) si cancellano da soli
  function resolve(B, order, res) {
    const { M, groups } = B, tab = [];
    const val = s => s.id ?? (s.w != null ? M[s.w].win : tab[s.g].done ? tab[s.g][s.pos].id : null);
    const play = m => {
      m.A = val(m.a); m.B = val(m.b); m.win = m.lose = m.score = null;
      const r = res[m.id];
      if (m.A != null && m.B != null && Array.isArray(r) && (r[0] === m.A || r[0] === m.B)) { m.win = r[0]; m.lose = r[0] === m.A ? m.B : m.A; m.score = r[1]; }
      else delete res[m.id];
    };
    M.filter(m => m.br === 'G').forEach(play);
    groups.forEach((g, i) => tab[i] = standings(M, g, i, order));
    M.filter(m => m.br === 'K').forEach(play);
    M.forEach((m, i) => m.no = i + 1);
    const champ = B.final != null ? M[B.final].win : tab[0].done ? tab[0][0].id : null;
    return { tab, champ };
  }

  function standings(M, g, gi, order) {
    const ms = M.filter(m => m.br === 'G' && m.grp === gi);
    const rows = g.map(id => ({ id, v: 0, p: 0, rd: 0 })), row = id => rows.find(r => r.id === id);
    for (const m of ms) if (m.win != null) { const w = row(m.win), l = row(m.lose), d = 2 - m.score; w.v++; l.p++; w.rd += d; l.rd -= d; }
    const h2h = (a, b) => { const m = ms.find(m => m.win != null && [a.id, b.id].includes(m.A) && [a.id, b.id].includes(m.B)); return m ? (m.win === a.id ? -1 : 1) : 0; };
    // ponytail: spareggi = vittorie, differenza round, scontro diretto, poi ordine del sorteggio; a tre perfettamente pari decide il sorteggio
    rows.sort((a, b) => b.v - a.v || b.rd - a.rd || h2h(a, b) || order.indexOf(a.id) - order.indexOf(b.id));
    rows.done = ms.every(m => m.win != null);
    return rows;
  }
  // --- fine motore

  // stato condiviso, salvato su Supabase (tabella regia)
  const blank = () => ({ out: [], ids: [], order: [], res: {}, fmt: 'auto', min: 4 });
  let st = blank(), players = [], admin = false, seen = null, ver = 0, saving = 0, fmtKey = '';

  const say = msg => { $('#oops').textContent = msg || ''; $('#oops').hidden = !msg; };
  async function push() {
    saving++;
    try {
      const r = await rpc('regia_salva', { token: TOKEN, nuovo_stato: st });
      if (!r.ok) throw 0;
      seen = await r.json(); say();
    } catch { say('Non salvato: controlla la connessione e ripeti l\'ultima mossa'); }
    saving--;
  }
  // ogni comando della regia: modifica lo stato, ridisegna subito, salva per tutti
  const change = fn => { fn(); ver++; render(); push(); };

  const name = id => players.find(p => p.id === id)?.display ?? '?';
  const present = () => players.filter(p => !st.out.includes(p.id));
  const ids = () => present().map(p => p.id).sort((a, b) => a - b);
  const changed = () => JSON.stringify(ids()) !== JSON.stringify(st.ids);
  const played = () => Object.keys(st.res).length > 0;
  const fmtOf = n => formats(n).find(f => `${f.G}-${f.q}` === st.fmt) || autoFmt(n);
  const fmtText = ({ G, q }, n) => n === 2 ? 'Sfida secca'
    : `${G === 1 ? 'Girone unico' : G + ' gironi'} · ${G === 1 && q === 1 ? 'vince chi fa più punti' : `${q === 1 ? 'passa il primo' : `passano i primi ${q}`}${G > 1 ? ' di ogni girone' : ''} ${{ 2: 'in finale', 4: 'in semifinale', 8: 'ai quarti', 16: 'agli ottavi', 32: 'ai sedicesimi' }[G * q]}`}`;
  const mins = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`;
  const count = (n, f) => build(Array.from({ length: n }, (_, i) => i), f.G, f.q).M.length;

  // sorteggio a fasce: casuale dentro ogni livello, i più forti fanno da teste di serie in gironi diversi (lo promette la pagina d'iscrizione)
  function shuffle() {
    const ps = present();
    for (let i = ps.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [ps[i], ps[j]] = [ps[j], ps[i]]; }
    st.order = ps.sort((a, b) => TIER[a.livello] - TIER[b.livello]).map(p => p.id);
    st.ids = ids(); st.res = {};
  }
  function draw() {
    change(shuffle);
    for (const b of [$('#dado'), $('#dado2')]) { b.classList.remove('roll'); void b.offsetWidth; b.classList.add('roll'); }
  }
  const sure = msg => !played() || confirm(msg);
  $('#dado').onclick = $('#dado2').onclick = () => sure('Rifare il sorteggio da capo? I risultati segnati si azzerano.') && draw();
  $('#azzera').onclick = () => played() && confirm('Azzerare tutti i risultati? Il sorteggio resta uguale.') && change(() => st.res = {});
  $('#formato').onchange = e => {
    if (sure('Cambiare formato azzera i risultati. Procedo?')) change(() => { st.fmt = e.target.value; st.res = {}; });
    else e.target.value = st.fmt;
  };
  $('#minuti').onchange = e => { const v = Math.round(+e.target.value); if (v >= 1 && v <= 30) change(() => st.min = v); };

  const label = (s, M) => s.w != null ? `Vince #${M[s.w].no}` : `${s.pos + 1}° girone ${LET[s.g]}`;
  // tocco: vince 2-0 → ritocco: 2-1 → ritocco: annullato
  const pick = (m, pid) => change(() => {
    const r = st.res[m.id];
    if (!r || r[0] !== pid) st.res[m.id] = [pid, 0]; else if (r[1] === 0) st.res[m.id] = [pid, 1]; else delete st.res[m.id];
  });

  function card(m, M, next) {
    const d = el('div', 'm' + (m === next ? ' now' : ''));
    d.append(el('span', 'no', '#' + m.no));
    for (const [pid, src] of [[m.A, m.a], [m.B, m.b]]) {
      const b = el('button', pid == null ? 'tbd' : m.win == null ? '' : m.win === pid ? 'win' : 'lose', pid == null ? label(src, M) : name(pid));
      if (m.win === pid && pid != null) b.prepend(el('span', 'sc', `2-${m.score}`));
      b.type = 'button';
      b.disabled = !admin || m.A == null || m.B == null;
      if (!b.disabled) b.onclick = () => pick(m, pid);
      d.append(b);
    }
    return d;
  }

  function render() {
    if (admin) renderAdmin();
    $('#warn').hidden = !admin || !changed();
    const n = st.order.length;
    $('#ora').hidden = $('#gironi-s').hidden = $('#ko-s').hidden = n < 2;
    if (n < 2) { $('#fmt').textContent = admin ? 'Servono almeno 2 giocatori' : 'Il sorteggio non è ancora fatto'; $('#durata').textContent = ''; return; }

    const f = fmtOf(n), B = build(st.order, f.G, f.q), { M, groups, G, Q } = B, { tab, champ } = resolve(B, st.order, st.res);
    const left = M.filter(m => m.win == null).length;
    $('#fmt').textContent = `${fmtText(f, n)} · ${n} giocatori`;
    $('#durata').textContent = `${M.length} incontri · nessun bye · ${left ? `ne mancano ${left}, circa ${mins(left * st.min)}` : 'finito'}`;

    // prossimo incontro: il primo pronto in ordine di gioco
    const next = M.find(m => m.A != null && m.B != null && m.win == null);
    $('#next').hidden = !next; $('#hint').hidden = !next || !admin;
    $('#champ').hidden = champ == null;
    $('#ora-t').textContent = next ? `Ora tocca a · #${next.no} ${next.title}` : champ != null ? 'Torneo finito' : '';
    if (champ != null) $('#champ').replaceChildren(el('small', '', 'Campione'), name(champ));
    if (next) for (const [cls, pid] of [['.a', next.A], ['.b', next.B]]) { const b = $('#next ' + cls); b.textContent = name(pid); b.disabled = !admin; b.onclick = () => pick(next, pid); }

    $('#gironi-t').textContent = G === 1 ? 'Girone' : 'Gironi';
    $('#gironi').replaceChildren(...groups.map((g, gi) => {
      const box = el('div', 'grp'), t = el('table', 'tab'), list = el('div', 'gms');
      t.innerHTML = '<tr><th></th><th></th><th>V</th><th>P</th><th>±R</th></tr>';
      tab[gi].forEach((r, i) => {
        const tr = el('tr', i < Q / G ? 'q' : '');
        for (const v of [i + 1, name(r.id), r.v, r.p, (r.rd > 0 ? '+' : '') + r.rd]) tr.append(el('td', '', v));
        t.append(tr);
      });
      for (const m of M) if (m.br === 'G' && m.grp === gi) list.append(card(m, M, next));
      box.append(el('h3', '', G === 1 ? 'Classifica' : `Girone ${LET[gi]}`), t, list);
      return box;
    }));

    $('#ko-s').hidden = Q < 2;
    const cols = [];
    for (const m of M) if (m.br === 'K') (cols[m.col] ??= []).push(m);
    $('#ko').replaceChildren(...cols.map(ms => {
      const col = el('div', 'col'), list = el('div', 'ms');
      col.append(el('h3', '', ms[0].title), list);
      for (const m of ms) list.append(card(m, M, next));
      return col;
    }));
  }

  function renderAdmin() {
    const n = st.order.length, sel = $('#formato');
    // le opzioni si ricostruiscono solo se cambiano, altrimenti il polling chiuderebbe il menu mentre lo apri
    const key = `${n}|${st.fmt}|${st.min}`;
    if (key !== fmtKey) {
      fmtKey = key;
      const a = autoFmt(n);
      sel.replaceChildren(...(n < 2 ? [] : [['auto', `Automatico: ${fmtText(a, n)} (${count(n, a)} incontri)`], ...formats(n).map(f => [`${f.G}-${f.q}`, `${fmtText(f, n)} · ${count(n, f)} incontri, ~${mins(count(n, f) * st.min)}`])]).map(([v, t]) => { const o = el('option', '', t); o.value = v; return o; }));
      sel.value = formats(n).some(f => `${f.G}-${f.q}` === st.fmt) ? st.fmt : 'auto';
    }
    if (document.activeElement !== $('#minuti')) $('#minuti').value = st.min;
    $('#azzera').disabled = !played();

    $('#players').replaceChildren(...players.map(p => {
      const li = el('li'), l = el('label'), cb = el('input'), d = el('div');
      cb.type = 'checkbox'; cb.checked = !st.out.includes(p.id);
      cb.onchange = () => change(() => { st.out = cb.checked ? st.out.filter(x => x !== p.id) : [...st.out, p.id]; if (!played()) shuffle(); });
      d.append(el('b', '', p.display), el('small', '', p.livello));
      l.append(cb, d);
      const ren = el('button', 'mini', '✎'), del = el('button', 'mini', '×');
      ren.type = del.type = 'button'; ren.title = 'Rinomina o cambia livello'; del.title = 'Elimina iscrizione';
      ren.setAttribute('aria-label', `Rinomina ${p.display}`); del.setAttribute('aria-label', `Elimina ${p.display}`);
      ren.onclick = async () => {
        const nome = prompt('Nome sul tabellone (max 20)', p.display);
        if (nome == null) return;
        const liv = prompt('Livello: Principiante, Me la cavo o Esperto', p.livello);
        if (liv != null && !(liv in TIER)) return alert('Livello non valido');
        await act({ giocatore: p.id, nuovo_nome: nome.trim().slice(0, 20) || null, nuovo_livello: liv });
      };
      del.onclick = async () => {
        if (!confirm(`Eliminare l'iscrizione di ${p.display}? Sparisce anche dal tabellone pubblico.`)) return;
        await act({ giocatore: p.id, elimina: true });
      };
      li.append(l, ren, del);
      return li;
    }));
    $('#quanti').textContent = `${present().length} in gara${st.out.length ? ` · ${st.out.length} assenti` : ''}`;
  }

  async function act(body) {
    try { if (!(await rpc('regia_giocatore', { token: TOKEN, ...body })).ok) throw 0; say(); } catch { say('Non è andata: controlla la connessione e riprova'); }
    await poll();
  }

  $('#add').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button');
    if (!f.reportValidity()) return;
    btn.disabled = true;
    let ok = false;
    try { ok = (await sb('iscrizioni', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ nome: f.nome.value.trim(), livello: f.livello.value }) })).ok; } catch {}
    btn.disabled = false;
    if (!ok) return say('Non è partita: controlla la connessione e riprova');
    say(); f.reset(); f.nome.focus();
    await poll();
    if (changed() && played() && confirm('Rifare subito il sorteggio con il nuovo giocatore? I risultati segnati si azzerano.')) draw();
  };

  // legge giocatori e stato; se nel frattempo la regia ha cambiato qualcosa in locale, la lettura vecchia si scarta
  async function poll() {
    const v = ver;
    let ok = false;
    try {
      const [r1, r2] = await Promise.all([sb('iscrizioni?select=id,display,livello&order=created_at'), sb('regia?select=stato,aggiornato')]);
      if (!r1.ok || !r2.ok) throw 0;
      players = await r1.json();
      const [row] = await r2.json();
      if (!row) throw 0;
      if (v === ver && !saving && row.aggiornato !== seen) { seen = row.aggiornato; st = { ...blank(), ...row.stato }; }
      ok = true;
      $('#live').classList.remove('off');
      $('#live span').textContent = `Live · ${new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    } catch {
      $('#live').classList.add('off');
      $('#live span').textContent = 'Non collegato';
    }
    // giocatori cambiati prima che si giochi: si risorteggia da soli; dopo decide la regia (avviso giallo)
    if (ok && admin && v === ver && changed() && !played()) draw(); else render();
  }

  (async () => {
    if (TOKEN) try { admin = await (await rpc('regia_entra', { token: TOKEN })).json() === true; } catch {}
    if (TOKEN && !admin) say('Link di regia non valido: vedi il tabellone in sola lettura');
    document.body.classList.toggle('is-admin', admin);
    await poll();
    setInterval(poll, POLL_MS);
  })();
</script>
</body>
</html>
